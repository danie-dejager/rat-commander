# Which files the bundled schemas are for. Generated by fetch_schemas.py.

[[schema]]
file = "compose-spec.json"
url = "https://raw.githubusercontent.com/compose-spec/compose-spec/main/schema/compose-spec.json"
files = ["**/docker-compose.yml", "**/docker-compose.yaml", "**/docker-compose.*.yml", "**/docker-compose.*.yaml", "**/compose.yml", "**/compose.yaml", "**/compose.*.yml", "**/compose.*.yaml"]

[[schema]]
file = "github-workflow.json"
url = "https://json.schemastore.org/github-workflow.json"
files = ["**/.github/workflows/*.yml", "**/.github/workflows/*.yaml"]

[[schema]]
file = "github-action.json"
url = "https://json.schemastore.org/github-action.json"
files = ["**/action.yml", "**/action.yaml"]

[[schema]]
file = "dependabot-2.0.json"
url = "https://json.schemastore.org/dependabot-2.0.json"
files = ["**/.github/dependabot.yml", "**/.github/dependabot.yaml"]

[[schema]]
file = "cargo.json"
url = "https://json.schemastore.org/cargo.json"
files = ["**/Cargo.toml"]

[[schema]]
file = "package.json"
url = "https://json.schemastore.org/package.json"
files = ["**/package.json"]

[[schema]]
file = "tsconfig.json"
url = "https://json.schemastore.org/tsconfig.json"
files = ["**/tsconfig.json", "**/tsconfig.*.json", "**/jsconfig.json"]

[[schema]]
file = "gitlab-ci.json"
url = "https://gitlab.com/gitlab-org/gitlab/-/raw/master/app/assets/javascripts/editor/schema/ci.json"
files = ["**/.gitlab-ci.yml", "**/.gitlab-ci.yaml"]
