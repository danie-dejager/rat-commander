name: CI

# Runs the test suite and the linter on every push to main and on pull requests.
# The release workflow only *builds* the packages, so this is what actually
# checks the code before a version tag goes out.
#
# `cargo fmt --check` is deliberately absent: the tree is hand-formatted (see the
# aligned struct literals in src/ui/theme.rs) and rustfmt currently wants to
# rewrite 125 of the ~130 source files, so a fmt gate would fail every run
# without saying anything useful about correctness.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    name: clippy + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # The C/C++ dependencies (unrar, bzip2, xz2, zip) dominate a cold build,
      # so caching matters much more here than in the release workflow.
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # The default `audio` feature links ALSA (through cpal), whose headers
      # ubuntu-latest does not ship.
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      # The default `rar` feature needs a C++ toolchain, which ubuntu-latest has
      # (unlike the ARM cross images, where release.yml passes
      # --no-default-features), so the default feature set is tested here.
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked
